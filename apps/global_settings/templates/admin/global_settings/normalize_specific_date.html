{% extends "admin/base_site.html" %}

{% block content %}
<div id="content-main">
    <h1>Normalize Specific Date Violations</h1>
    <form method="post" action="{{ action_url }}" style="margin-top:16px;max-width:420px;">
        {% csrf_token %}
        <div style="display:flex;flex-direction:column;gap:8px;">
            <label for="id_normalize_date"><strong>Select date</strong></label>
            <input id="id_normalize_date" type="date" name="normalize_date" required>
        </div>
        <div style="margin-top:14px;display:flex;gap:8px;">
            <button type="submit" class="default">Apply Normalization</button>
            <a href="/admin/global_settings/settings/" class="button">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
